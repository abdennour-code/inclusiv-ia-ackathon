<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inclusiv'IA - Simplificateur FALC</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1; }
        .card-falc { border-left: 5px solid #0d6efd; background-color: #ffffff; }
        .result-box { white-space: pre-line; font-size: 1.1rem; line-height: 1.6; }
    </style>
</head>
<body>

    <header class="py-4 bg-white border-bottom text-center">
        <h1 class="fw-bold m-0">Inclusiv'IA 🧠</h1>
        <p class="text-muted m-0">Simplification de texte en FALC (Facile À Lire et à Comprendre)</p>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Formulaire de saisie -->
                <div class="card p-4 shadow-sm mb-4">
                    <label for="texte-input" class="form-label fw-bold">Saisissez un texte complexe :</label>
                    <textarea id="texte-input" class="form-control mb-3" rows="5" placeholder="Ex: Nonobstant les règles administratives en vigueur..."></textarea>
                    <button id="btn-analyser" class="btn btn-primary btn-lg w-100">
                        ⚡ Lancer l'analyse IA
                    </button>
                </div>

                <!-- 🎯 ZONE D'AFFICHAGE DU RÉSULTAT ET BOUTON VÉOCAL -->
                <div id="card-resultat" class="card p-4 shadow-sm card-falc d-none" aria-live="polite">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 text-primary fw-bold m-0">Résultat de l'IA :</h2>
                        <!-- 🔊 BOUTON D'ÉCOUTE VOCALE -->
                        <button id="btn-ecouter" class="btn btn-outline-primary btn-sm">
                            🔊 Écouter le résultat
                        </button>
                    </div>
                    <div id="contenu-resultat" class="result-box text-dark">
                        <em>Le résultat simplifié s'affichera ici...</em>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="m-0 small">Inclusiv'IA &copy; 2026 - Plateforme d'Accessibilité Numérique</p>
            <small class="text-muted">Conforme aux recommandations RGAA & FALC</small>
        </div>
    </footer>

    <script>
        const btn = document.getElementById('btn-analyser');
        const input = document.getElementById('texte-input');
        const cardResultat = document.getElementById('card-resultat');
        const contenuResultat = document.getElementById('contenu-resultat');
        const btnEcouter = document.getElementById('btn-ecouter');

        // 1. Analyse IA
        btn.addEventListener('click', async () => {
            const texte = input.value.trim();
            if (!texte) {
                alert("Veuillez saisir un texte à simplifier.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "⏳ Analyse IA en cours...";
            cardResultat.classList.remove('d-none');
            contenuResultat.innerHTML = "<em>L'IA simplifie votre texte...</em>";

            try {
                const formData = new FormData();
                formData.append('texte', texte);

                const response = await fetch('http://127.0.0.1:8000/api/analyse-texte', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.succes) {
                    contenuResultat.innerText = data.resultat;
                } else {
                    contenuResultat.innerHTML = `<span class="text-danger">❌ Erreur API : ${data.erreur}</span>`;
                }

            } catch (error) {
                contenuResultat.innerHTML = `<span class="text-danger">❌ Impossible de contacter le serveur Python (vérifiez FastAPI sur le port 8000).</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "⚡ Lancer l'analyse IA";
            }
        });

        // 2. Synthèse vocale native
        btnEcouter.addEventListener('click', () => {
            const texteAEcouter = contenuResultat.innerText;
            if (!texteAEcouter) return;

            window.speechSynthesis.cancel(); // Arrête la lecture précédente si elle tourne

            const message = new SpeechSynthesisUtterance(texteAEcouter);
            message.lang = 'fr-FR';
            message.rate = 0.95; // Débit légèrement adapté pour la clarté

            window.speechSynthesis.speak(message);
        });
    </script>
</body>
</html>
